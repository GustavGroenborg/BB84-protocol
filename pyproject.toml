[project]
name = "bb84-cli"
version = "0.1.0"
description = "A CLI to run a simple implementation of the BB84 protocol."
readme = "README.md"
requires-python = ">=3.11, <3.13"
dependencies = [
    "argparse>=1.4.0",
    "dotenv>=0.9.9",
    "numpy>=2.4.2",
    "qiskit>=2.3.0",
    "qiskit-aer>=0.17.2",
    "qiskit-ibm-runtime>=0.45.1",
]
